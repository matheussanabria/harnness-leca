<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Leca</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/css/index.css">
<link rel="stylesheet" href="/css/app-header.css">
</head>
<body>
<header data-app-header data-current="home">
  <div data-slot="left" class="header-brand-wrap">
    <select id="sel"></select>
    <span class="badge" id="act"></span>
  </div>
  <div data-slot="right" class="header-actions">
    <button class="btn-remote-connect" id="btnConnectMobile" onclick="openRemoteConnectModal()" title="Conectar smartphone via Wi-Fi ou Túnel Remoto para usar e testar o app em tempo real">
      <i class="fa-solid fa-mobile-screen"></i> Celular
    </button>
    <span id="presenceStrip" class="presence-strip"></span>
    <button class="btn-studio-toggle" id="btnToggleDesign" onclick="toggleDesignMode()" title="Abrir Visão 360° do Projeto: Scrum, Kanban de Sprint, Backlog, Épicos, Mapa e Auditoria">
      <i class="fa-solid fa-cubes-stacked"></i> Scrum & Projeto 360°
    </button>
    <button class="btn-studio-toggle" id="btnToggleStudio" onclick="toggleStudioMode()" title="Abrir Studio de Vibecoding com Live Preview da Aplicação e Agentes DAI">
      <i class="fa-solid fa-palette"></i> Studio
    </button>
    <button class="btn-live-chat" onclick="openInteractiveChat()" title="Conversar com o Projeto">
      <i class="fa-solid fa-message"></i> Conversar
    </button>
  </div>
</header>
<main id="mainDashboard">
  <section>
    <h1 id="title"></h1>
    <div class="sub">Projeto local · <span id="meta"></span></div>
    <div class="act-header">
      <div style="display:flex;align-items:center;gap:10px">
        <h3 class="sech" style="margin:0">Atividade</h3>
        <span id="syncToast" class="sync-toast" style="display:none"></span>
      </div>
      <div class="sync-bar">
        <div class="sync-btn-group" title="Sincronizar conversas feitas externamente para este projeto">
          <button class="btn-sync-action btn-sync-all" id="btnSyncAll" title="Sincronizar conversas de todos os motores (Claude Code, Gemini e OpenCode)" onclick="syncProjectChats('all')">
            <span class="sync-rot"><i class="fa-solid fa-rotate"></i></span> Sincronizar Tudo
          </button>
          <button class="btn-sync-action btn-sync-claude" id="btnSyncClaude" title="Sincronizar conversas do Claude Code (~/.claude/projects)" onclick="syncProjectChats('claude')">
            <i class="fa-solid fa-asterisk"></i> Claude
          </button>
          <button class="btn-sync-action btn-sync-gemini" id="btnSyncGemini" title="Sincronizar conversas do Gemini / Antigravity (~/.gemini/antigravity-ide/brain)" onclick="syncProjectChats('gemini')">
            <i class="fa-solid fa-gem"></i> Gemini
          </button>
          <button class="btn-sync-action btn-sync-opencode" id="btnSyncOpencode" title="Sincronizar conversas do OpenCode (~/.local/share/opencode)" onclick="syncProjectChats('opencode')">
            <i class="fa-solid fa-code"></i> OpenCode
          </button>
        </div>
        <button class="btn-map" onclick="showMappingTable()"><i class="fa-solid fa-chart-simple"></i> Mapeamento</button>
      </div>
    </div>

    <!-- Painel de Filtros por Motor, Grupos/Subgrupos, Busca e Alternância Tabela/Lista -->
    <div class="chats-control-panel" id="chatsControlPanel">
      <!-- 1. Badges dos Motores -->
      <div class="engine-filter-bar" id="engineFilterBar">
        <button type="button" class="eng-badge-filter active" data-eng="all" onclick="setChatEngineFilter('all')">
          <span>Todas</span> <span class="filter-count" id="countEngAll">0</span>
        </button>
        <button type="button" class="eng-badge-filter" data-eng="claude" onclick="setChatEngineFilter('claude')">
          <span style="color:#d97757"><i class="fa-solid fa-asterisk"></i> Claude</span> <span class="filter-count" id="countEngClaude">0</span>
        </button>
        <button type="button" class="eng-badge-filter" data-eng="gemini" onclick="setChatEngineFilter('gemini')">
          <span style="color:#7ca5f5"><i class="fa-solid fa-gem"></i> Gemini</span> <span class="filter-count" id="countEngGemini">0</span>
        </button>
        <button type="button" class="eng-badge-filter" data-eng="opencode" onclick="setChatEngineFilter('opencode')">
          <span style="color:#7de2a3"><i class="fa-solid fa-code"></i> OpenCode</span> <span class="filter-count" id="countEngOpencode">0</span>
        </button>
      </div>

      <!-- 2. Barra de Grupos e Subgrupos -->
      <div class="group-filter-bar" id="groupFilterBar">
        <span style="font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.4px"><i class="fa-solid fa-folder"></i> Grupos:</span>
        <div id="groupChipsContainer" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"></div>
        <button type="button" class="btn-manage-groups" onclick="openManageGroupsModal()" title="Criar ou organizar grupos e subgrupos de conversas">
          <i class="fa-solid fa-gear"></i> Gerenciar Grupos
        </button>
      </div>
      <div class="subgroup-filter-bar" id="subgroupFilterBar" style="display:none">
        <span style="font-size:11px;font-weight:600;color:var(--mute)">↳ Subgrupos:</span>
        <div id="subgroupChipsContainer" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"></div>
      </div>

      <!-- 3. Toolbar de Busca, Ordenação e Modo Tabela/Lista -->
      <div class="chats-toolbar">
        <div class="search-input-wrap">
          <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input type="text" id="chatSearchInput" class="chats-search-input" placeholder="Buscar conversas por título, motor, grupo, arquivo..." oninput="onChatSearchInput(this.value)">
          <button type="button" id="chatSearchClear" class="search-clear-btn" style="display:none" onclick="clearChatSearch()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="chats-toolbar-controls">
          <select id="chatSortSelect" class="chats-sort-select" onchange="onChatSortSelectChange(this.value)">
            <option value="mtime_desc">Data: Mais recentes</option>
            <option value="mtime_asc">Data: Mais antigas</option>
            <option value="title_asc">Título: A → Z</option>
            <option value="title_desc">Título: Z → A</option>
            <option value="agent_asc">Motor (Claude, Gemini, OpenCode)</option>
            <option value="group_asc">Grupo (A → Z)</option>
            <option value="turns_desc">Mais turnos / mensagens</option>
          </select>
          <div class="view-mode-toggle">
            <button type="button" id="btnViewList" class="view-btn" onclick="setChatViewMode('list')" title="Visualização em Lista Compacta">
              <i class="fa-solid fa-list"></i> Lista
            </button>
            <button type="button" id="btnViewTable" class="view-btn active" onclick="setChatViewMode('table')" title="Visualização em Tabela Tabular Ordenável">
              <i class="fa-solid fa-table"></i> Tabela
            </button>
          </div>
        </div>
        <span id="chatsResultCount" class="chats-counter" style="font-size:12px;color:var(--mute);margin-left:auto;white-space:nowrap"></span>
      </div>
    </div>

    <div id="chats"></div>
  </section>
  <aside class="card" id="side"></aside>
</main>
<div id="designWorkspace" class="design-workspace" style="display:none">
  <div class="design-header-bar">
    <div class="design-nav-tabs" id="designNavTabs">
      <button type="button" class="design-nav-tab active" data-view="scrum" onclick="setDesignView('scrum')">
        <i class="fa-solid fa-list-check"></i> Scrum & Sprints
      </button>
      <button type="button" class="design-nav-tab" data-view="layers" onclick="setDesignView('layers')">
        <i class="fa-solid fa-layer-group"></i> Mapa em Camadas
      </button>
      <button type="button" class="design-nav-tab" data-view="board" onclick="setDesignView('board')">
        <i class="fa-solid fa-table-columns"></i> Quadro de Componentes
      </button>
      <button type="button" class="design-nav-tab" data-view="audit" onclick="setDesignView('audit')">
        <i class="fa-solid fa-shield-halved"></i> Auditoria
      </button>
      <button type="button" class="design-nav-tab" data-view="prototypes" onclick="setDesignView('prototypes')">
        <i class="fa-solid fa-compass-drafting"></i> Protótipos
      </button>
      <button type="button" class="design-nav-tab" data-view="artifacts" onclick="setDesignView('artifacts')">
        <i class="fa-solid fa-box-archive"></i> Artefatos
      </button>
      <button type="button" class="design-nav-tab" data-view="routines" onclick="setDesignView('routines')">
        <i class="fa-solid fa-repeat"></i> Rotinas
      </button>
      <button type="button" class="design-nav-tab" data-view="workflows" onclick="setDesignView('workflows')">
        <i class="fa-solid fa-diagram-project"></i> Workflows
      </button>
      <button type="button" class="design-nav-tab" onclick="toggleDesignMode(false); location.hash='#/canvas-mindmap'" title="Mind maps (Canvas)">
        <i class="fa-solid fa-sitemap"></i> Mapa mental
      </button>
      <button type="button" class="design-nav-tab" onclick="toggleDesignMode(false); location.hash='#/canvas-board'" title="Free-form boards (Canvas)">
        <i class="fa-solid fa-chalkboard"></i> Quadro livre
      </button>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button type="button" class="btn-card-action" onclick="toggleDesignMode(false)" title="Voltar ao Dashboard">
        <i class="fa-solid fa-arrow-left"></i> Voltar ao Dashboard
      </button>
    </div>
  </div>
  <div id="designViewContainer" class="design-view-container"></div>
</div>
<div data-partial="/partials/studio.html"></div>

<div data-partial="/partials/studio-drawer.html"></div>
<div data-partial="/partials/dialogs-misc.html"></div>
<div data-partial="/partials/dialogs-groups.html"></div>
<div data-partial="/partials/dialogs-skills.html"></div>
<div data-partial="/partials/dialogs-chat.html"></div>

<script type="module" src="/js/shared/app-header.js"></script>
<script type="module" src="/js/boot.js"></script>
</body>
</html>

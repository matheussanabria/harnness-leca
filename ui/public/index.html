<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Leca</title>
<style>
:root{--bg:#1f1e1d;--panel:#262624;--panel2:#30302e;--line:#3a3937;--text:#f0eee6;--mute:#9a978e;--accent:#d97757}
@media (prefers-color-scheme: light){:root{--bg:#faf9f5;--panel:#fff;--panel2:#f0eee6;--line:#e3e0d5;--text:#1f1e1d;--mute:#6f6c63}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line)}
header .logo{font-weight:600;color:var(--accent)}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit}
.badge{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
main{max-width:1180px;margin:0 auto;padding:32px 28px;display:grid;grid-template-columns:1fr 380px;gap:28px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
h1{font-family:Georgia,serif;font-weight:500;font-size:30px;margin:0 0 4px}
.sub{color:var(--mute);margin-bottom:24px}
h3.sech{font-size:13px;color:var(--mute);font-weight:500;margin:28px 0 8px;display:flex;justify-content:space-between;gap:12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--panel)}
.row b{font-weight:500}.row span{color:var(--mute);white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.sec{padding:16px 18px;border-bottom:1px solid var(--line)}.sec:last-child{border:0}
.sec h4{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.tag{font-size:11px;font-weight:400;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.preview{color:var(--mute);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.empty{color:var(--mute);font-size:13px;font-style:italic}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.file{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;width:150px;font-size:12px;word-break:break-all;cursor:pointer}
.file i{display:inline-block;margin-top:8px;font-style:normal;font-size:10px;border:1px solid var(--mute);border-radius:4px;padding:0 4px;color:var(--mute)}
.more{color:var(--accent);cursor:pointer;font-size:12px;margin-top:6px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;width:min(720px,92vw);max-height:80vh;padding:0}
dialog::backdrop{background:#0008}
.dh{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);font-weight:600}
.dh button{background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer}
.db{padding:6px 20px 20px;overflow:auto;max-height:65vh}
.db a{color:var(--accent,#e8825a);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.db h1,.db h2,.db h3{font-family:inherit;color:var(--text);font-size:17px;margin:16px 0 6px}
.db pre{background:var(--panel2);padding:12px;border-radius:8px;overflow:auto;white-space:pre-wrap}
.db code{background:var(--panel2);padding:1px 5px;border-radius:4px}
.db li{margin:4px 0;line-height:1.55}
.db ul,.db ol{margin:8px 0;padding-left:24px}
.db blockquote{border-left:3px solid var(--accent);margin:8px 0;padding:6px 12px;background:var(--panel2);border-radius:0 6px 6px 0;color:var(--mute)}
.db table{border-collapse:collapse;margin:8px 0;font-size:13px}
.db th,.db td{border:1px solid var(--line);padding:4px 8px;text-align:left}
dialog{overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
.dh{flex:none}
.db{flex:1;min-height:0;max-height:none;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
dialog.wide{width:min(900px,94vw);height:min(86vh,900px);max-height:none}
.clip{position:relative;max-height:240px;overflow:hidden}
.clip.open{max-height:none}
.clip.fade::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(transparent,var(--fade))}
.msg.user{--fade:var(--accent)}.msg.claude,.msg.gemini,.msg.opencode{--fade:var(--panel2)}
.clip.open::after{display:none}
.toggle{background:none;border:0;color:inherit;opacity:.85;cursor:pointer;font:inherit;font-size:12px;text-decoration:underline;padding:6px 0 0}
.msg.user .bubble p{margin:0}
.chat{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.msg .who{font-size:11px;color:var(--mute);margin-bottom:3px}
.msg.gemini .who{color:#7ca5f5}
.msg.claude .who{color:#d97757}
.msg.opencode .who{color:#3cb371}
.msg .bubble{border-radius:14px;padding:12px 16px;max-width:88%;overflow-wrap:anywhere}
.msg .bubble p{margin:6px 0;line-height:1.55}
.msg .bubble p:first-child{margin-top:0}
.msg .bubble p:last-child{margin-bottom:0}
.msg .bubble h2,.msg .bubble h3,.msg .bubble h4{font-size:15px;margin:12px 0 6px}
/* Listas com espaçamento confortável, indentação adequada e bullets temáticos */
.msg .bubble ul,.msg .bubble ol{margin:8px 0;padding-left:22px}
.msg .bubble ul:first-child,.msg .bubble ol:first-child{margin-top:0}
.msg .bubble ul:last-child,.msg .bubble ol:last-child{margin-bottom:0}
.msg .bubble ul ul,.msg .bubble ol ol,.msg .bubble ul ol,.msg .bubble ol ul{margin:4px 0 4px 4px;padding-left:18px}
.msg .bubble li{margin:5px 0;line-height:1.55;padding-left:2px}
.msg .bubble li::marker{color:var(--mute);font-size:1.1em}
.msg.user .bubble li::marker{color:#fff}
.msg.claude .bubble li::marker{color:#e07a5f}
.msg.opencode .bubble li::marker{color:#4ade80}
.msg.gemini .bubble li::marker{color:#7ca5f5}
.msg .bubble blockquote{border-left:3px solid var(--accent);margin:8px 0;padding:6px 12px;background:#ffffff0a;border-radius:0 6px 6px 0;color:var(--mute)}
.msg.user{align-items:flex-end;display:flex;flex-direction:column}
.msg.user .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.user .bubble code{background:#0003;color:#fff}
.msg.claude .bubble,.msg.gemini .bubble,.msg.opencode .bubble{background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
details.internal{border:1px dashed var(--line);border-radius:10px;font-size:13px;color:var(--mute);background:transparent}
details.internal>summary{padding:7px 12px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
details.internal>summary .names{opacity:.7;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.step{margin:0 10px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
details.step.err{border-color:#c0504d}
details.step>summary{padding:5px 10px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.step>summary b{color:var(--text);font-weight:500}
details.step .lbl{font-size:11px;padding:2px 10px 0;text-transform:uppercase;letter-spacing:.04em}
details.step pre{margin:2px 10px 8px;font-size:12px;max-height:240px;overflow:auto}
details.internal[open]>summary{border-bottom:1px dashed var(--line);margin-bottom:6px}
.status-badge{font-size:11px;border-radius:6px;padding:2px 7px;border:1px solid;display:inline-block;white-space:nowrap}
.status-ok{color:#7de2a3;border-color:#7de2a344;background:#7de2a311}
.status-nova{color:#d97757;border-color:#d9775744;background:#d9775711}
.status-alterada{color:#e0a040;border-color:#e0a04044;background:#e0a04011}
.btn-map{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.btn-map:hover{background:var(--panel);border-color:var(--mute)}
.table-wrap{width:100%;overflow-x:auto}
.table-full{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.table-full th,.table-full td{border:1px solid var(--line);padding:8px 10px;text-align:left}
.table-full th{background:var(--panel2);font-weight:600}
.table-full tr:hover{background:var(--panel2)}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.filter-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-live-chat{background:linear-gradient(135deg,#d97757,#e06c45);color:#fff;border:0;border-radius:8px;padding:6px 14px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;box-shadow:0 2px 8px #d9775744;transition:opacity .15s}
.btn-live-chat:hover{opacity:.9}
/* Modal do Chat Interativo */
.chat-dialog{width:min(940px,94vw);height:min(88vh,820px);padding:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 36px #000a}
.chat-header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap;gap:10px}
.chat-header .title{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.engine-tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:8px;border:1px solid var(--line)}
.eng-tab{background:none;border:0;color:var(--mute);padding:5px 12px;border-radius:6px;font:inherit;font-size:12px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:5px;transition:all .15s}
.eng-tab:hover{color:var(--text)}
.eng-tab.active[data-engine="claude"]{background:#d97757;color:#fff}
.eng-tab.active[data-engine="opencode"]{background:#3cb371;color:#fff}
.eng-tab.active[data-engine="gemini"]{background:#5c87f2;color:#fff}
.chat-context-bar{background:var(--panel2);padding:6px 18px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chat-context-bar code{background:var(--bg);padding:1px 5px;border-radius:4px;color:var(--text)}
.eng-badge{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--mute)}
.chat-controls-bar{background:var(--panel);padding:7px 18px;font-size:12px;color:var(--text);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.chat-controls-bar .ctrl-item{display:flex;align-items:center;gap:8px}
.chat-controls-bar label{color:var(--mute);font-size:11px;display:flex;align-items:center;gap:4px}
.chat-controls-bar label b{color:var(--text);font-weight:600}
.chat-controls-bar select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit;font-size:12px;outline:none;cursor:pointer;max-width:320px}
.chat-controls-bar select:focus{border-color:var(--accent)}
.effort-toggle{display:flex;background:var(--bg);padding:2px;border-radius:8px;border:1px solid var(--line);gap:2px}
.effort-btn{background:none;border:0;color:var(--mute);padding:3px 10px;border-radius:6px;font:inherit;font-size:11.5px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.effort-btn:hover{color:var(--text)}
.effort-btn.active{background:var(--panel2);font-weight:600;box-shadow:0 1px 3px #0004}
.effort-btn.active[data-effort="low"]{color:#7de2a3}
.effort-btn.active[data-effort="medium"]{color:#e0a040}
.effort-btn.active[data-effort="high"]{color:#d97757}
.effort-btn.active[data-effort="xhigh"]{color:#b388ff}
.effort-btn.active[data-effort="max"]{color:#f43f5e}
.chat-history{flex:1;min-height:0;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.chat-footer{border-top:1px solid var(--line);padding:12px 16px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
.chat-input-wrap{display:flex;gap:10px;align-items:flex-end}
.chat-input{flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:inherit;font-size:14px;resize:none;max-height:160px;min-height:44px;line-height:1.4}
.chat-input:focus{outline:none;border-color:var(--accent)}
.btn-send{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600;font-size:13px;cursor:pointer;transition:opacity .15s}
.btn-send:hover{opacity:.9}
.btn-send:disabled{opacity:.4;cursor:not-allowed}
.btn-chat-action{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.btn-chat-action:hover{background:var(--panel);border-color:var(--mute)}
.btn-chat-action:disabled{opacity:.4;cursor:not-allowed}
.chat-thinking{background:var(--bg);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:12px}
.chat-thinking summary{padding:6px 10px;cursor:pointer;color:var(--mute);font-weight:500}
.chat-thinking .think-content{padding:8px 12px;color:var(--mute);white-space:pre-wrap;border-top:1px solid var(--line);font-family:monospace;font-size:11px;max-height:180px;overflow:auto}
.stream-cursor{display:inline-block;color:var(--accent);font-weight:bold;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.msg.opencode .who{color:#7de2a3}
.msg.opencode .bubble{background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
</style>
</head>
<body>
<header>
  <span class="logo">✱ Harness Leca</span>
  <select id="sel"></select>
  <span class="badge" id="act"></span>
  <div style="margin-left:auto;display:flex;gap:10px;align-items:center">
    <button class="btn-live-chat" onclick="openInteractiveChat()">
      <span>💬</span> Conversar com o Projeto
    </button>
  </div>
</header>
<main>
  <section>
    <h1 id="title"></h1>
    <div class="sub">Projeto local · <span id="meta"></span></div>
    <h3 class="sech"><span>Atividade</span> <button class="btn-map" onclick="showMappingTable()">📊 Mapeamento de conversas e pendências</button></h3>
    <div id="chats"></div>
  </section>
  <aside class="card" id="side"></aside>
</main>
<dialog id="dlg"><div class="dh"><span id="dt"></span><button onclick="dlg.close()">×</button></div><div class="db" id="dbody"></div></dialog>
<dialog id="chatDlg" class="chat-dialog">
  <div class="chat-header">
    <div class="title">
      <span id="chatTitle">💬 Chat do Projeto</span>
    </div>
    <div class="engine-tabs" id="engineTabs">
      <button class="eng-tab active" data-engine="claude" onclick="switchEngine('claude')">✱ Claude Code</button>
      <button class="eng-tab" data-engine="opencode" onclick="switchEngine('opencode')">◆ OpenCode</button>
      <button class="eng-tab" data-engine="gemini" onclick="switchEngine('gemini')">✦ Gemini</button>
    </div>
    <button onclick="chatDlg.close()" style="background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer">×</button>
  </div>
  <div class="chat-context-bar">
    <div>✦ Contexto ativo: <code>instructions.md</code> + <code>memory.md</code> injetados automaticamente.</div>
    <div id="engineAuthBadge" class="eng-badge">Plano Claude Pro (CLI local)</div>
  </div>
  <div class="chat-controls-bar">
    <div class="ctrl-item">
      <label for="chatModelSelect"><b>Modelo:</b></label>
      <select id="chatModelSelect" onchange="onModelChange(this.value)"></select>
    </div>
    <div class="ctrl-item" style="margin-left:auto">
      <label><b>Esforço / Raciocínio:</b></label>
      <div class="effort-toggle" id="effortToggle">
        <button type="button" class="effort-btn" data-effort="low" onclick="setEffort('low')">Low</button>
        <button type="button" class="effort-btn active" data-effort="medium" onclick="setEffort('medium')">Medium</button>
        <button type="button" class="effort-btn" data-effort="high" onclick="setEffort('high')">High</button>
        <button type="button" class="effort-btn" data-effort="xhigh" onclick="setEffort('xhigh')">Extra High</button>
        <button type="button" class="effort-btn" data-effort="max" onclick="setEffort('max')">Max</button>
      </div>
    </div>
  </div>
  <div class="chat-history" id="chatHistory">
    <div class="empty" style="text-align:center;padding:40px 10px;color:var(--mute)">
      Comece uma conversa com o motor escolhido usando todo o contexto deste projeto.
    </div>
  </div>
  <div class="chat-footer">
    <div class="chat-input-wrap">
      <textarea id="chatInput" class="chat-input" placeholder="Pergunte algo sobre o projeto... (Enter para enviar, Shift+Enter para nova linha)" rows="1" oninput="autoGrow(this)" onkeydown="handleChatKey(event)"></textarea>
      <button id="btnSendChat" class="btn-send" onclick="sendChatMessage()">Enviar ➤</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn-chat-action" onclick="resetChatSession()">🔄 Novo Chat</button>
        <button class="btn-chat-action" id="btnSaveChat" onclick="saveCurrentChat()" disabled>💾 Salvar no Projeto</button>
        <span id="chatStatusText" style="font-size:11px;color:var(--mute)"></span>
      </div>
      <div style="font-size:11px;color:var(--mute)">Sem chaves avulsas · Execução via Sessão/Plano</div>
    </div>
  </div>
</dialog>
<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean = t => t.replace(/<!\x2d\x2d[\s\S]*?-\x2d>/g, "").replace(/^# .*\n?/, "").trim();
const fmt = ms => new Date(ms).toLocaleDateString("pt-BR", {day:"numeric", month:"short"}).replace(".", "");

// Markdown básico com suporte completo a listas (-, *, +, •, 1.), blocos de código, títulos, tabelas e citações.
function md(t) {
  const code = [];
  t = t.replace(/\u0000/g, "").replace(/```[^\n]*\n([\s\S]*?)```/g, (_, c) => { code.push(c); return `\u0000${code.length - 1}\u0000`; });
  // Links http(s): [texto](url) e URLs soltas (guardados à parte para o itálico/negrito não mexer neles).
  const links = [];
  const stash = (url, label) => { links.push(`<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`); return `\u0001${links.length - 1}\u0001`; };
  const inline = s => esc(s)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, l, u) => stash(u, l))
    .replace(/(^|[\s(])(https?:\/\/[^\s<)\u0001]+)/g, (_, pre, u) => pre + stash(u, u))
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\W)_(.+?)_(?=\W|$)/g, "$1<i>$2</i>").replace(/`(.+?)`/g, "<code>$1</code>").replace(/\u0001(\d+)\u0001/g, (_, i) => links[i]);
  const lines = t.split("\n"), out = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    const cell = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
    if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || "")) {
      const head = cell(l); i += 2; const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(cell(lines[i++])); i--;
      out.push("<table><tr>" + head.map(c => `<th>${inline(c)}</th>`).join("") + "</tr>" +
        rows.map(r => "<tr>" + r.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</table>");
    } else if (/^#{1,3} /.test(l)) {
      const n = l.match(/^#+/)[0].length;
      out.push(`<h${n + 1}>${inline(l.replace(/^#+ /, ""))}</h${n + 1}>`);
    } else if (/^\s*([*\-+]\s+|[•⁃◦▪▫]\s*)/.test(l)) {
      const items = [];
      while (i < lines.length && /^\s*([*\-+]\s+|[•⁃◦▪▫]\s*)/.test(lines[i])) {
        const line = lines[i];
        const isNested = /^( {2,}|\t+)/.test(line);
        const text = line.replace(/^\s*([*\-+]\s+|[•⁃◦▪▫]\s*)/, "");
        if (isNested && items.length > 0) {
          items[items.length - 1] += `<ul><li>${inline(text)}</li></ul>`;
        } else {
          items.push(`<li>${inline(text)}</li>`);
        }
        i++;
      }
      i--;
      out.push(`<ul>${items.join("")}</ul>`);
    } else if (/^\s*\d+\.\s+/.test(l)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        const line = lines[i];
        const isNested = /^( {2,}|\t+)/.test(line);
        const text = line.replace(/^\s*\d+\.\s+/, "");
        if (isNested && items.length > 0) {
          items[items.length - 1] += `<ol><li>${inline(text)}</li></ol>`;
        } else {
          items.push(`<li>${inline(text)}</li>`);
        }
        i++;
      }
      i--;
      out.push(`<ol>${items.join("")}</ol>`);
    } else if (/^\s*>\s*/.test(l)) {
      const bq = [];
      while (i < lines.length && /^\s*>\s*/.test(lines[i])) {
        bq.push(inline(lines[i].replace(/^\s*>\s*/, "")));
        i++;
      }
      i--;
      out.push(`<blockquote>${bq.join("<br>")}</blockquote>`);
    } else if (/^\u0000\d+\u0000$/.test(l.trim())) {
      out.push("<pre>" + esc(code[l.trim().slice(1, -1)]) + "</pre>");
    } else {
      out.push(l.trim() ? "<p>" + inline(l) + "</p>" : "");
    }
  }
  return out.join("");
}

// Lê o formato do importador: turnos "## Você/Claude" + blocos ":::tool ... :::" (processamento interno).
function parseChat(src) {
  const items = [];
  let who = null, buf = [];
  const flush = () => {
    const text = buf.join("\n").trim(); buf = [];
    if (text && who) items.push({ who, text });
  };
  const lines = src.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^## (Você|Claude|Gemini|Antigravity|opencode)\s*$/i.test(l)) {
      flush();
      who = /^## Você\s*$/i.test(l) ? "user" : /Claude/i.test(l) ? "claude" : /opencode/i.test(l) ? "opencode" : "gemini";
      continue;
    }
    const m = l.match(/^:::(tool|thinking)\s*(.*)$/);
    if (m && who) {
      flush();
      const body = []; i++;
      while (i < lines.length && lines[i] !== ":::") body.push(lines[i++]);
      const [name, hint, err] = m[1] === "thinking" ? ["Raciocínio", "", ""] : m[2].split(" | ");
      const txt = body.join("\n"), k = txt.indexOf("\n--- resultado\n");
      const input = (k >= 0 ? txt.slice(0, k) : txt).replace(/^--- entrada\n/, "");
      const tool = { name, hint: hint || "", error: err === "erro", input, result: k >= 0 ? txt.slice(k + 15) : "", thinking: m[1] === "thinking" };
      const last = items[items.length - 1];
      if (last && last.who === "internal") last.tools.push(tool); else items.push({ who: "internal", tools: [tool] });
      continue;
    }
    buf.push(l);
  }
  flush();
  return items;
}

function renderChat(src) {
  return '<div class="chat">' + parseChat(src).map(it => {
    if (it.who === "user") return `<div class="msg user"><div class="who">Você</div><div class="bubble"><div class="clip">${md(it.text.replace(/<\/?pasted_content[^>]*>/g, ""))}</div></div></div>`;
    if (it.who === "claude") return `<div class="msg claude"><div class="who">✱ Claude</div><div class="bubble"><div class="clip">${md(it.text)}</div></div></div>`;
    if (it.who === "opencode") return `<div class="msg opencode"><div class="who">◆ OpenCode</div><div class="bubble"><div class="clip">${md(it.text)}</div></div></div>`;
    if (it.who === "gemini") return `<div class="msg gemini"><div class="who">✦ Gemini</div><div class="bubble"><div class="clip">${md(it.text)}</div></div></div>`;
    const n = it.tools.length, errs = it.tools.filter(t => t.error).length;
    const names = [...new Set(it.tools.map(t => t.name))].slice(0, 4).join(", ");
    return `<details class="internal"><summary>⚙ Processamento interno · ${n} ${n === 1 ? "etapa" : "etapas"}${errs ? ` · ${errs} com erro` : ""}<span class="names">${esc(names)}</span></summary>` +
      it.tools.map(t => `<details class="step${t.error ? " err" : ""}"><summary><b>${esc(t.name)}</b> <span>${esc(t.hint)}</span></summary>` +
        (t.thinking ? `<pre>${esc(t.input)}</pre>` : `<div class="lbl">Entrada</div><pre>${esc(t.input)}</pre><div class="lbl">Resultado</div><pre>${esc(t.result || "(vazio)")}</pre>`) +
        "</details>").join("") + "</details>";
  }).join("") + "</div>";
}

async function sendChatMessage() {
  if (isChatStreaming) return;
  const input = $("chatInput");
  const text = input.value.trim();
  if (!text) return;

  chatTurns.push({ role: "user", text });
  input.value = "";
  input.style.height = "auto";

  const assistantTurn = {
    role: "assistant",
    text: "",
    thinking: "",
    engine: currentEngine,
    model: engineSettings[currentEngine].model,
    effort: engineSettings[currentEngine].effort,
  };
  chatTurns.push(assistantTurn);
  isChatStreaming = true;
  $("btnSendChat").disabled = true;
  $("btnSaveChat").disabled = true;
  $("chatStatusText").textContent = `Conectando com ${currentEngine}...`;
  renderChatHistory();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        engine: currentEngine,
        prompt: text,
        slug: P.slug,
        sessionId: engineSessions[currentEngine],
        // Turnos anteriores (sem o atual): o Gemini não guarda sessão no servidor e precisa deles.
        history: chatTurns.slice(0, -2).map(t => ({ role: t.role, text: t.text })),
        model: engineSettings[currentEngine].model,
        effort: engineSettings[currentEngine].effort,
      }),
    });

    if (!res.ok) {
      const errJson = await res.json().catch(() => ({}));
      throw new Error(errJson.error || `HTTP ${res.status}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const jsonStr = line.slice(6).trim();
        if (!jsonStr) continue;
        try {
          const data = JSON.parse(jsonStr);
          if (data.sessionId) engineSessions[currentEngine] = data.sessionId;

          if (data.type === "text" && data.text) {
            assistantTurn.text += data.text;
            $("chatStatusText").textContent = "Recebendo resposta...";
            renderChatHistory();
          } else if (data.type === "thinking" && data.text) {
            assistantTurn.thinking = (assistantTurn.thinking || "") + data.text;
            $("chatStatusText").textContent = "Pensando (raciocínio interno)...";
            renderChatHistory();
          } else if (data.type === "error") {
            assistantTurn.text += `\n\n> ⚠️ **Erro:** ${data.error}`;
            renderChatHistory();
          } else if (data.type === "done") {
            if (data.sessionId) engineSessions[currentEngine] = data.sessionId;
            if (data.fullText && !assistantTurn.text) {
              assistantTurn.text = data.fullText;
            }
          }
        } catch {}
      }
    }
  } catch (err) {
    assistantTurn.text += `\n\n> ⚠️ **Erro na conexão:** ${err.message}`;
  } finally {
    isChatStreaming = false;
    $("btnSendChat").disabled = false;
    $("btnSaveChat").disabled = chatTurns.length < 2;
    const currentSId = engineSessions[currentEngine];
    $("chatStatusText").textContent = currentSId ? `Sessão ativa (${currentEngine}): ${currentSId.slice(0, 14)}...` : "";
    renderChatHistory();
    $("chatInput").focus();
  }
}

  $("sel").onchange = e => load(e.target.value);
  if (!S.projects.length) {
    $("title").textContent = "Nenhum projeto ainda";
    $("meta").textContent = "veja o passo 4 do SETUP.md";
    $("chats").innerHTML = '<p class="empty">Crie um projeto copiando projects/_template ou importe conversas com tools/import-claude-code-chats.js.</p>';
    return;
  }
  load(S.projects.includes(S.active) ? S.active : S.projects[0]);
})();
</script>
</body>
</html>

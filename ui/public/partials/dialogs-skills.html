<!-- Diálogo: Visualizador e Editor de Skill -->
<dialog id="skillViewerDlg" class="chat-dialog" style="max-width:820px;height:min(88vh,800px)">
  <div class="chat-header">
    <div class="title" style="display:flex;align-items:center;gap:8px">
      <span style="font-size:18px">⚡</span>
      <span id="skillViewTitle" style="font-weight:600">Skill</span>
      <span id="skillViewTargetBadge" class="eng-badge"></span>
      <span id="skillViewVersionBadge" class="tag"></span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-left:auto">
      <button type="button" class="btn-chat-action" id="btnToggleSkillEdit" onclick="toggleEditSkillMode()">✏️ Editar</button>
      <button type="button" class="btn-chat-action" id="btnDeleteSkill" onclick="deleteCurrentSkill()" style="color:#ef4444;border-color:rgba(239,68,68,0.3)">🗑️ Excluir</button>
      <button onclick="$('skillViewerDlg').close()" style="background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer">×</button>
    </div>
  </div>
  <div id="skillViewModeContent" style="display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden">
    <div style="padding:10px 18px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div id="skillViewDesc" style="font-size:12.5px;color:var(--mute);flex:1;min-width:240px;line-height:1.4"></div>
      <div id="skillViewSubTabs" style="display:flex;gap:4px;flex-shrink:0">
        <button type="button" class="btn-vp active" id="subtabSkillMd" onclick="showSkillSubTab('md')">📄 SKILL.md</button>
        <button type="button" class="btn-vp" id="subtabSkillRefs" onclick="showSkillSubTab('refs')">📚 Referências (<span id="skillRefsCount">0</span>)</button>
      </div>
    </div>
    <div id="skillMdBody" class="db" style="flex:1;padding:16px 20px;overflow-y:auto"></div>
    <div id="skillRefsBody" style="display:none;flex:1;padding:16px 20px;overflow-y:auto;flex-direction:column;gap:12px"></div>
  </div>
  <div id="skillEditModeContent" style="display:none;flex-direction:column;flex:1;min-height:0;padding:16px 20px;gap:12px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:12px;color:var(--mute)">Editando <code>SKILL.md</code> (markdown + frontmatter YAML)</span>
      <span id="skillEditStatus" style="font-size:12px;color:#7de2a3"></span>
    </div>
    <textarea id="skillEditTextarea" class="skill-editor-textarea" style="flex:1"></textarea>
    <div style="display:flex;justify-content:flex-end;gap:10px">
      <button type="button" class="btn-chat-action" onclick="toggleEditSkillMode(false)">Cancelar</button>
      <button type="button" class="btn-send" id="btnSaveSkillEdit" onclick="saveCurrentSkillEdit()" style="height:36px;padding:6px 16px">💾 Salvar Alterações</button>
    </div>
  </div>
</dialog>

<!-- Diálogo: Incluir Skill no Projeto -->
<dialog id="addSkillDlg" class="chat-dialog" style="max-width:820px;height:min(88vh,760px)">
  <div class="chat-header">
    <div class="title" style="display:flex;align-items:center;gap:8px">
      <span style="font-size:18px">➕</span>
      <span style="font-weight:600">Incluir Skill no Projeto</span>
    </div>
    <button onclick="$('addSkillDlg').close()" style="background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer">×</button>
  </div>
  <div style="padding:10px 18px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:8px">
      <label for="addSkillTargetSelect" style="font-size:12px;font-weight:600;color:var(--text)">Destino (.agents):</label>
      <select id="addSkillTargetSelect" onchange="onAddSkillTargetChange(this.value)" style="font-size:12px;padding:4px 8px;max-width:280px"></select>
    </div>
    <div class="engine-tabs" id="addSkillTabs" style="margin-left:auto">
      <button type="button" class="eng-tab active" data-tab="templates" onclick="switchAddSkillTab('templates')">⚡ Catálogo ST12</button>
      <button type="button" class="eng-tab" data-tab="custom" onclick="switchAddSkillTab('custom')">✏️ Criar Nova Skill</button>
      <button type="button" class="eng-tab" data-tab="import" onclick="switchAddSkillTab('import')">📂 Clonar / Importar</button>
    </div>
  </div>
  <div class="db" style="flex:1;padding:16px 20px;overflow-y:auto">
    <!-- Tab 1: Templates -->
    <div id="addSkillTabTemplates">
      <div id="templateBundleBanner" style="background:rgba(217,119,87,0.12);border:1px solid rgba(217,119,87,0.3);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div>
          <b id="templateBundleTitle" style="color:var(--text);font-size:13.5px">Pacote Padrão ST12</b>
          <div id="templateBundleDesc" style="color:var(--mute);font-size:12px;margin-top:2px">Instale com 1 clique todas as diretrizes padrão deste tipo de repositório.</div>
        </div>
        <button type="button" id="btnInstallBundle" class="btn-send" style="height:34px;padding:4px 14px;font-size:12px" onclick="installSkillBundle()">⚡ Instalar Pacote Completo</button>
      </div>
      <div id="templateCardsList" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>

    <!-- Tab 2: Custom -->
    <div id="addSkillTabCustom" style="display:none;flex-direction:column;gap:12px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Nome / Identificador (slug):</label>
          <input type="text" id="customSkillName" class="chats-search-input" placeholder="ex: regras-negocio-autorizacao" style="width:100%">
        </div>
        <div>
          <label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Versão inicial:</label>
          <input type="text" id="customSkillVersion" class="chats-search-input" value="1.0.0" style="width:100%">
        </div>
      </div>
      <div>
        <label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Descrição breve da Skill:</label>
        <input type="text" id="customSkillDesc" class="chats-search-input" placeholder="ex: Diretrizes de autorização e liberação de medicamentos..." style="width:100%">
      </div>
      <div>
        <label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Conteúdo do SKILL.md:</label>
        <textarea id="customSkillContent" class="skill-editor-textarea" style="height:260px" placeholder="# Título da Skill&#10;&#10;Instruções e diretrizes detalhadas..."></textarea>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:8px">
        <button type="button" class="btn-chat-action" onclick="addSkillDlg.close()">Cancelar</button>
        <button type="button" class="btn-send" onclick="createCustomSkill()" style="height:36px;padding:6px 18px">➕ Criar Skill</button>
      </div>
    </div>

    <!-- Tab 3: Import -->
    <div id="addSkillTabImport" style="display:none;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <div style="font-size:12.5px;color:var(--mute)">Importe skills reconhecidas do sistema (Antigravity/Gemini, DAI, .agents) ou clone de outros repositórios:</div>
        <div style="display:flex;align-items:center;gap:8px">
          <input type="text" id="importSkillFilterInput" oninput="filterImportSkills(this.value)" placeholder="🔍 Filtrar skills..." class="chats-search-input" style="width:190px;font-size:11.5px;padding:3px 8px">
          <select id="importSkillSourceSelect" onchange="filterImportSkills()" style="font-size:11.5px;padding:3px 6px">
            <option value="all">Todas as fontes</option>
            <option value="gemini">Global Gemini</option>
            <option value="dai">Catálogo DAI</option>
            <option value="harness">Harness (.agents)</option>
            <option value="project">Outros Projetos</option>
          </select>
        </div>
      </div>
      <div id="importSkillsList" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
  </div>
</dialog>

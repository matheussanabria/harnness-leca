<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Leca · Consumo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/css/consumo.css">
</head>
<body>
<header>
  <a class="logo" href="/"><i class="fa-solid fa-asterisk" aria-hidden="true"></i> Harness Leca</a>
  <span class="badge">Consumo</span>
  <span style="flex:1"></span>
  <a class="nav-link" href="/"><i class="fa-solid fa-house" aria-hidden="true"></i> Início</a>
</header>
<main>
  <h1>Consumo</h1>
  <p class="sub">Cotas por provedor, uso por combo do 9Router e do OpenCode. Somente leitura.</p>
  <div class="c-toolbar">
    <div id="cAsOf" class="c-asofs" aria-live="polite"></div>
    <button type="button" class="btn-row" id="cRefresh"><i class="fa-solid fa-rotate" aria-hidden="true"></i> Atualizar</button>
  </div>
  <section><h2><i class="fa-solid fa-gauge-high" aria-hidden="true"></i> Cotas</h2><div id="cQuotas"><p class="c-empty">Carregando...</p></div></section>
  <section><h2><i class="fa-solid fa-chart-column" aria-hidden="true"></i> Chamadas por dia</h2><div id="cTrend"></div></section>
  <section><h2><i class="fa-solid fa-route" aria-hidden="true"></i> 9Router por combo</h2><div id="cCombos"></div></section>
  <section><h2><i class="fa-solid fa-terminal" aria-hidden="true"></i> OpenCode</h2><div id="cOpenCode"></div></section>
  <section><h2><i class="fa-solid fa-gem" aria-hidden="true"></i> Gemini / Antigravity</h2><div id="cGemini"></div></section>
</main>
<script type="module">
  import { startConsumoPage } from "/js/consumo/consumo-page.js";
  startConsumoPage();
</script>
</body>
</html>

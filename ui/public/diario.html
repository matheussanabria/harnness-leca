<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness · Diário</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#1f1e1d;--panel:#262624;--panel2:#30302e;--line:#3a3937;--text:#f0eee6;--mute:#9a978e;--accent:#d97757}
@media (prefers-color-scheme: light){:root{--bg:#faf9f5;--panel:#fff;--panel2:#f0eee6;--line:#e3e0d5;--text:#1f1e1d;--mute:#6f6c63}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line)}
header .logo{font-weight:600;color:var(--accent);text-decoration:none}
.badge{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.nav-link{font-size:13px;color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 12px;background:var(--panel);display:inline-flex;align-items:center;gap:6px}
.nav-link:hover{border-color:var(--accent);color:var(--accent)}
main{max-width:1000px;margin:0 auto;padding:32px 28px}
h1{font-family:Georgia,serif;font-weight:500;font-size:30px;margin:0 0 4px}
.sub{color:var(--mute);margin-bottom:20px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:22px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
.filters select,.filters input{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;min-width:140px}
.filters input[type=search]{min-width:200px}
.btn-row{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.btn-row:hover{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--mute);font-size:13px;font-style:italic;padding:18px 0}
.day{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.day-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;background:var(--panel2);cursor:pointer;user-select:none}
.day-h b{font-size:15px}
.day-h .meta{font-size:12px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.day.closed .sess-wrap{display:none}
.sess{padding:14px 18px;border-top:1px solid var(--line)}
.sess h4{margin:0 0 8px;font-size:14.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.time{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:400;font-size:13px}
.tag{font-size:11px;font-weight:500;border-radius:6px;padding:1px 7px;border:1px solid var(--line);color:var(--mute)}
.ag-claude{color:#d97757;border-color:#d9775755}
.ag-gemini{color:#5c87f2;border-color:#5c87f255}
.ag-opencode{color:#3cb371;border-color:#3cb37155}
.dis{color:#e0a040;border-color:#e0a04055}
.lbl{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 3px}
ul{margin:0;padding-left:20px;font-size:13.5px}
li{margin:2px 0;word-break:break-word}
code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px}
details summary{cursor:pointer;color:var(--mute);font-size:12.5px;margin-top:8px}
.src{font-size:11.5px;color:var(--mute);margin-top:8px}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px 0;font-size:13px;color:var(--mute)}
.pager button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.pager button:disabled{opacity:.45;cursor:default}
.pager button:not(:disabled):hover{border-color:var(--accent);color:var(--accent)}
@media (max-width: 600px){
  header{padding:10px 14px}header .badge{display:none}
  main{padding:16px 12px}h1{font-size:22px}
  .filters label,.filters select,.filters input{width:100%}
}
</style>
<link rel="stylesheet" href="/css/app-header.css">
</head>
<body>
<header data-app-header data-current="diario">
</header>
<main>
  <h1>Diário de atividade</h1>
  <div class="sub" id="sub">Carregando…</div>

  <div class="filters">
    <label>Projeto <select id="fProject"></select></label>
    <label>Agente <select id="fAgent"><option value="">todos</option></select></label>
    <label>De <input type="date" id="fFrom"></label>
    <label>Até <input type="date" id="fTo"></label>
    <label>Buscar <input type="search" id="fText" placeholder="pedido, arquivo, comando, DIS-…"></label>
    <label>Ordem <select id="fOrder">
      <option value="day:desc">Recentes primeiro</option>
      <option value="day:asc">Antigos primeiro</option>
      <option value="sessions:desc">Mais sessões</option>
      <option value="sessions:asc">Menos sessões</option>
    </select></label>
    <label>Por página <select id="fPageSize">
      <option value="10">10 dias</option>
      <option value="25">25 dias</option>
      <option value="50">50 dias</option>
    </select></label>
    <button class="btn-row" id="btnClear">Limpar</button>
    <button class="btn-row" id="btnToggle" aria-pressed="false">Recolher tudo</button>
  </div>

  <div id="days"><div class="empty">Carregando…</div></div>
  <nav class="pager" aria-label="Paginação do diário">
    <button type="button" id="btnPrev"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i> Anterior</button>
    <span id="pageInfo" role="status" aria-live="polite">Página 1 de 1</span>
    <button type="button" id="btnNext">Próxima <i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
  </nav>
</main>
<script type="module" src="/js/modules/diario-page.js"></script>
<script type="module" src="/js/shared/app-header.js"></script>
</body>
</html>
